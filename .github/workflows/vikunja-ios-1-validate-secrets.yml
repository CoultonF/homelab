name: Vikunja iOS 1. Validate secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vikunja-ios-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/vikunja-ios

jobs:
  validate:
    name: Validate required secrets
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode is unavailable at $DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/vikunja-ios

      - name: Validate secrets
        run: bundle exec fastlane validate_secrets
