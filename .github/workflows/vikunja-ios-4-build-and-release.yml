name: Vikunja iOS 4. Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vikunja-ios-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/vikunja-ios

jobs:
  build:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode is unavailable at $DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/vikunja-ios

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Vikunja
        run: bundle exec fastlane build

      - name: Upload to TestFlight and wait for processing
        run: bundle exec fastlane release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vikunja-ios-build
          path: |
            apps/vikunja-ios/build/Vikunja.ipa
            ~/Library/Logs/gym/*.log
          retention-days: 7
