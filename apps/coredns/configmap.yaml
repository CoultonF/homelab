apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-config
  namespace: coredns
  labels:
    app.kubernetes.io/name: coredns
data:
  Corefile: |
    # Custom zone for homelab - resolves to cluster nodes
    homelab:53 {
        log
        errors
        hosts {
            100.88.79.159 admin-pod.homelab
            fallthrough
        }
        # If no match, forward to upstream
        forward . 8.8.8.8 1.1.1.1
    }

    # Default zone - forward all other queries to upstream DNS
    .:53 {
        log
        errors
        health {
            lameduck 5s
        }
        ready
        # Split-horizon: answer coultonf.com hosts with the node LAN IP so
        # local/tailnet clients hit ingress-nginx directly instead of
        # hairpinning through Cloudflare (reachable via tailscale subnet router too)
        hosts {
            192.168.0.249 shop.coultonf.com
            192.168.0.249 mealie.coultonf.com
            192.168.0.249 home.coultonf.com
            192.168.0.249 photos.coultonf.com
            192.168.0.249 todo.coultonf.com
            fallthrough
        }
        # Forward to Google and Cloudflare DNS
        forward . 8.8.8.8 1.1.1.1 {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
