name: Vikunja
options:
  bundleIdPrefix: com.coultonf
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "16.0"

targets:
  Vikunja:
    type: application
    platform: iOS
    sources:
      - Vikunja
    info:
      path: Vikunja/Info.plist
      properties:
        CFBundleDisplayName: Vikunja
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        WKAppBoundDomains:
          - coultonf.com
        NSCameraUsageDescription: Take photos and videos to attach to Vikunja.
        NSPhotoLibraryUsageDescription: Choose photos and videos to attach to Vikunja.
        NSMicrophoneUsageDescription: Record audio when attaching a video to Vikunja.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coultonf.vikunja
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework

schemes:
  Vikunja:
    build:
      targets:
        Vikunja: all
    run:
      config: Debug
    archive:
      config: Release
