apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja-ingress
  namespace: vikunja
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
  - host: todo.coultonf.com
    http:
      paths:
      - backend:
          service:
            name: vikunja
            port:
              number: 3456
        path: /
        pathType: Prefix
