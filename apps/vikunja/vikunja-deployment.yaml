apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: vikunja
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
      - name: vikunja
        image: vikunja/vikunja:2.6.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vikunja-config
        env:
        # Signs login sessions; unset = random per start = everyone logged
        # out on every restart. Secret is not in git — see README.md.
        - name: VIKUNJA_SERVICE_SECRET
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: service-secret
        ports:
        - name: http
          containerPort: 3456
          protocol: TCP
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        # Direct mounts only — NO subPath (see apps/wishlist/README.md).
        volumeMounts:
        - mountPath: /db
          name: vikunja-db
        - mountPath: /app/vikunja/files
          name: vikunja-files
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: vikunja-db
        persistentVolumeClaim:
          claimName: vikunja-db
      - name: vikunja-files
        persistentVolumeClaim:
          claimName: vikunja-files
      - name: tmp
        emptyDir: {}
